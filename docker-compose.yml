# Local Moodle LMS for the team.  Start:  docker compose up -d   Stop:  docker compose down
# Settings come from .env in this folder (MOODLE_SITE_URL, MOODLE_ADMIN_PASSWORD).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
      POSTGRES_DB: moodle
    volumes:
      - postgres:/var/lib/postgresql/data

  moodle:
    image: erseco/alpine-moodle:5.3
    restart: unless-stopped
    environment:
      # Must match exactly what people type in the browser (see README "Team access").
      SITE_URL: ${MOODLE_SITE_URL:-http://localhost:8080}
      MOODLE_SITENAME: Team_Moodle  # no spaces: the image's install script splits on them
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: ${MOODLE_ADMIN_PASSWORD:?set MOODLE_ADMIN_PASSWORD in .env}
      MOODLE_EMAIL: admin@example.com
    ports:
      - "8080:8080"
    volumes:
      - moodledata:/var/www/moodledata
      - moodlehtml:/var/www/html
    depends_on:
      - postgres

volumes:
  postgres:
  moodledata:
  moodlehtml:
