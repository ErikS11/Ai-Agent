<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Assistant</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --panel: #f5f7fa; --text: #1d2125; --muted: #6a737b; --line: #dee2e6;
    --accent: #0f6cbf; --accent-text: #ffffff; --bubble-user: #0f6cbf; --bubble-bot: #f1f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1e21; --panel: #23272b; --text: #e9ecef; --muted: #9aa2a9; --line: #343a40;
            --accent: #4c9be8; --accent-text: #0b1520; --bubble-user: #2f6fb0; --bubble-bot: #2b3035; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--accent); color: var(--accent-text); }
  header h1 { font-size: 16px; margin: 0; flex: 1; font-weight: 600; }
  header button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 6px;
                  padding: 4px 9px; font-size: 13px; cursor: pointer; opacity: .9; }
  header button:hover { opacity: 1; }
  #close { border: none; font-size: 20px; line-height: 1; padding: 2px 6px; display: none; }
  body.embedded #close { display: block; }
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 9px 12px; border-radius: 14px; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.bot { align-self: flex-start; background: var(--bubble-bot); border-bottom-left-radius: 4px; }
  .msg.bot p { margin: 0 0 8px; } .msg.bot p:last-child { margin-bottom: 0; }
  .msg.bot ul, .msg.bot ol { margin: 4px 0 8px; padding-left: 20px; }
  .msg.bot code { background: rgba(127,127,127,.18); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
  .msg.bot pre { background: rgba(127,127,127,.15); padding: 8px; border-radius: 6px; overflow-x: auto; }
  .msg.bot pre code { background: none; padding: 0; }
  .msg.error { align-self: center; color: #c0392b; font-size: 13px; background: none; }
  .meta { align-self: flex-start; font-size: 12px; color: var(--muted); margin-top: -6px; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; }
  .typing span { animation: blink 1.2s infinite; } .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  #intro { color: var(--muted); font-size: 14px; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #chips button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 16px;
                  padding: 5px 10px; font-size: 13px; cursor: pointer; }
  #chips button:hover { border-color: var(--accent); }
  form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font: inherit;
             background: var(--bg); color: var(--text); max-height: 120px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send { background: var(--accent); color: var(--accent-text); border: none; border-radius: 10px; padding: 0 16px; font-weight: 600; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Study Assistant</h1>
  <button id="new" type="button" title="Start a new conversation">New chat</button>
  <button id="close" type="button" aria-label="Close">&times;</button>
</header>
<div id="log" aria-live="polite">
  <div id="intro">
    Hi! I can check what's due, find missing work, explain your grades and course policies, and help you study.
    <div id="chips">
      <button type="button">What's due this week?</button>
      <button type="button">Am I missing anything?</button>
      <button type="button">How am I doing?</button>
      <button type="button">Quiz me on loops</button>
    </div>
  </div>
</div>
<form id="form">
  <textarea id="input" rows="1" placeholder="Ask about your courses…" aria-label="Message"></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script>
  const params = new URLSearchParams(location.search);
  if (params.get('embed') === '1') document.body.classList.add('embedded');

  const log = document.getElementById('log');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const intro = document.getElementById('intro');
  const LABELS = {
    list_my_courses: 'your courses', list_my_assignments: 'assignments', get_assignment: 'assignment details',
    get_syllabus: 'the syllabus', list_modules: 'course sections', get_page: 'course notes', list_announcements: 'announcements',
  };

  const store = {
    get() { try { return sessionStorage.getItem('sid'); } catch { return null; } },
    set(v) { try { v ? sessionStorage.setItem('sid', v) : sessionStorage.removeItem('sid'); } catch {} },
  };

  function render(md) {
    if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(md));
    const div = document.createElement('div'); div.textContent = md; return div.innerHTML.replace(/\n/g, '<br>');
  }
  function add(cls, html, isText) {
    const el = document.createElement('div');
    el.className = cls;
    if (isText) el.textContent = html; else el.innerHTML = html;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function ask(text) {
    if (!text.trim() || send.disabled) return;
    intro.style.display = 'none';
    add('msg user', text, true);
    input.value = ''; autosize();
    send.disabled = true;
    const typing = add('typing', 'Thinking<span>.</span><span>.</span><span>.</span>');
    try {
      const res = await fetch('api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: store.get(), message: text }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || `Error ${res.status}`);
      store.set(data.session_id);
      typing.remove();
      add('msg bot', render(data.reply));
      const looked = [...new Set(data.looked_up.map(n => LABELS[n] || n))];
      if (looked.length) add('meta', 'Checked ' + looked.join(', '), true);
    } catch (e) {
      typing.remove();
      add('msg error', e.message === 'Failed to fetch' ? "Can't reach the assistant. Is the server running?" : e.message, true);
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; }
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(input.value); }
  });
  document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); ask(input.value); });
  document.querySelectorAll('#chips button').forEach(b => b.addEventListener('click', () => ask(b.textContent)));
  document.getElementById('new').addEventListener('click', () => {
    const sid = store.get();
    if (sid) fetch('api/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                 body: JSON.stringify({ session_id: sid, message: '-' }) });
    store.set(null);
    log.querySelectorAll(':scope > :not(#intro)').forEach(el => el.remove());
    intro.style.display = '';
    input.focus();
  });
  document.getElementById('close').addEventListener('click', () => parent.postMessage('study-assistant:close', '*'));
  input.focus();
</script>
</body>
</html>
